<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10141d">
    <title>Sign in | CodeTogether</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/login.js" defer></script>
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <a class="brand" href="/" aria-label="CodeTogether home">
        <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
        <span>CodeTogether</span>
      </a>
      <p class="eyebrow">PRIVATE COLLABORATION SPACE</p>
      <h1>Welcome back</h1>
      <p class="muted">Sign in with one of the three configured accounts.</p>

      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required maxlength="80">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">

        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button class="button button-primary button-wide" type="submit">Sign in</button>
      </form>
      <p class="auth-footnote">Access is limited to the three accounts configured by the host.</p>
    </main>
  </body>
</html>
